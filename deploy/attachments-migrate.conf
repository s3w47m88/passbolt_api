; One-shot: apply the Passbolt/Attachments plugin migrations on container start.
; The core entrypoint runs `passbolt migrate` (core only) BEFORE exec'ing
; supervisord, so by the time this program starts the DB is reachable and core
; schema is current. `migrations migrate` is idempotent: it applies only pending
; plugin migrations and exits 0 when there is nothing to do.
;
; Runs as www-data via supervisord's `user=` (NOT `su`, which strips the DB
; connection env). A non-zero exit logs FATAL here but does NOT stop nginx/php,
; so a migration problem never takes the site down — it surfaces in logs.
; Retry loop: the core entrypoint usually finishes core migrations before
; supervisord starts, but not always — retry for ~60s so a cold start where
; core migration is still running does not leave the plugin table unmigrated.
[program:attachments-migrate]
command=/bin/bash -c 'for i in 1 2 3 4 5 6; do /usr/share/php/passbolt/bin/cake migrations migrate -p Passbolt/Attachments --no-lock && exit 0; echo "[attachments] migrate attempt $i failed; retrying in 10s"; sleep 10; done; echo "[attachments] migrate did not succeed"; exit 1'
user=www-data
directory=/usr/share/php/passbolt
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
