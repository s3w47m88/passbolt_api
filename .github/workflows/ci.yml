name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint_and_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit (lint)
        # gitleaks runs as a dedicated step below; skip it here so CI
        # does not build the Go hook and secret scanning stays in one place.
        run: SKIP=gitleaks pre-commit run --all-files --show-diff-on-failure
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.30.0
          BASE=https://github.com/gitleaks/gitleaks/releases/download
          FILE=gitleaks_${VERSION}_linux_x64.tar.gz
          curl -sSL "${BASE}/v${VERSION}/${FILE}" | tar -xz gitleaks
          ./gitleaks detect --redact --verbose --exit-code 1

  build:
    runs-on: ubuntu-latest
    needs: lint_and_scan
    steps:
      - uses: actions/checkout@v4
      - name: Build Passbolt image
        run: docker build -t passbolt-ci .
